table:
  name: gym_dumbbell_sets
  schema: public
object_relationships:
  - name: gym
    using:
      foreign_key_constraint_on: gym_id
insert_permissions:
  - role: user
    permission:
      check: &a3
        gym:
          owner_user_id:
            _eq: X-Hasura-User-Id
      columns: &a1
        - gym_id
        - weights_kg
        - min_kg
        - max_kg
        - increment_kg
  - role: admin
    permission:
      check: &a2 {}
      columns: *a1
  - role: super_admin
    permission:
      check: *a2
      columns: *a1
select_permissions:
  - role: user
    permission:
      columns: &a4
        - id
        - gym_id
        - weights_kg
        - min_kg
        - max_kg
        - increment_kg
        - created_at
      filter: *a3
      limit: 200
  - role: admin
    permission:
      columns: *a4
      filter: *a2
      limit: 200
  - role: super_admin
    permission:
      columns: *a4
      filter: *a2
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a3
      check: *a3
      columns: *a1
  - role: admin
    permission:
      filter: *a2
      check: *a2
      columns: *a1
  - role: super_admin
    permission:
      filter: *a2
      check: *a2
      columns: *a1
delete_permissions:
  - role: user
    permission:
      filter: *a3
  - role: admin
    permission:
      filter: *a2
  - role: super_admin
    permission:
      filter: *a2
