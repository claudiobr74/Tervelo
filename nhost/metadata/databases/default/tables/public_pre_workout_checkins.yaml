table:
  name: pre_workout_checkins
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - training_session_id
        - checked_in_at
        - status
        - sleep_quality
        - energy
        - muscle_recovery
        - stress
        - has_pain
        - pain_region
        - pain_intensity
        - pain_worsens_with_movement
        - pain_blocks_planned_exercise
        - has_planned_time
        - available_minutes
        - client_mutation_id
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - training_session_id
        - checked_in_at
        - status
        - sleep_quality
        - energy
        - muscle_recovery
        - stress
        - has_pain
        - pain_region
        - pain_intensity
        - pain_worsens_with_movement
        - pain_blocks_planned_exercise
        - has_planned_time
        - available_minutes
        - client_mutation_id
        - created_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
