table:
  name: wearable_devices
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - provider
        - display_name
        - device_type
        - last_connected_at
        - is_active
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - provider
        - display_name
        - device_type
        - last_connected_at
        - is_active
        - created_at
        - updated_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a1
      check: *a1
      columns:
        - display_name
        - last_connected_at
        - is_active
