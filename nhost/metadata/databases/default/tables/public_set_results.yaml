table:
  name: set_results
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - set_id
        - performed_at
        - weight_kg
        - reps
        - duration_seconds
        - rest_after_seconds
        - perceived_exertion
        - reps_in_reserve
        - equipment_id
        - side
        - method_kind
        - client_mutation_id
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - set_id
        - user_id
        - performed_at
        - weight_kg
        - reps
        - duration_seconds
        - rest_after_seconds
        - perceived_exertion
        - reps_in_reserve
        - equipment_id
        - side
        - method_kind
        - client_mutation_id
        - created_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
