table:
  name: weekly_coach_reviews
  schema: public
object_relationships:
  - name: athlete_state_snapshot
    using:
      foreign_key_constraint_on: athlete_state_snapshot_id
array_relationships:
  - name: decisions
    using:
      foreign_key_constraint_on:
        column: weekly_review_id
        table:
          name: weekly_review_decisions
          schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - training_week_id
        - athlete_state_snapshot_id
        - period_start
        - period_end
        - contract_version
        - prompt_version
        - model
        - agents_json
        - headline
        - overview
        - what_improved
        - what_needs_attention
        - training_copy
        - nutrition_copy
        - body_copy
        - recovery_copy
        - heart_rate_copy
        - next_week_copy
        - decision
        - suggested_changes_json
        - status
        - ai_run_id
        - generated_at
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - training_week_id
        - athlete_state_snapshot_id
        - period_start
        - period_end
        - contract_version
        - prompt_version
        - model
        - agents_json
        - headline
        - overview
        - what_improved
        - what_needs_attention
        - training_copy
        - nutrition_copy
        - body_copy
        - recovery_copy
        - heart_rate_copy
        - next_week_copy
        - decision
        - suggested_changes_json
        - status
        - ai_run_id
        - generated_at
        - created_at
        - updated_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a1
      check: *a1
      columns:
        - status
