table:
  name: exercise_aliases
  schema: public
insert_permissions:
  - role: admin
    permission:
      check: &a1 {}
      columns: &a2
        - canonical_exercise_id
        - alias
        - locale
  - role: super_admin
    permission:
      check: *a1
      columns: *a2
select_permissions:
  - role: user
    permission:
      columns: &a3
        - id
        - canonical_exercise_id
        - alias
        - locale
      filter: *a1
      limit: 2500
  - role: admin
    permission:
      columns: *a3
      filter: *a1
      limit: 2500
  - role: super_admin
    permission:
      columns: *a3
      filter: *a1
      limit: 2500
update_permissions:
  - role: admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
  - role: super_admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
delete_permissions:
  - role: admin
    permission:
      filter: *a1
  - role: super_admin
    permission:
      filter: *a1
