table:
  name: recovery_checkins
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - checked_in_at
        - sleep_quality
        - energy
        - mood
        - muscle_soreness
        - discomfort
        - stress
        - perceived_recovery
        - notes
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - checked_in_at
        - sleep_quality
        - energy
        - mood
        - muscle_soreness
        - discomfort
        - stress
        - perceived_recovery
        - notes
        - created_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
