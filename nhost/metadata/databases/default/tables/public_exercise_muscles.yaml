table:
  name: exercise_muscles
  schema: public
insert_permissions:
  - role: admin
    permission:
      check: &a1 {}
      columns: &a2
        - exercise_id
        - muscle_id
        - role
  - role: super_admin
    permission:
      check: *a1
      columns: *a2
select_permissions:
  - role: user
    permission:
      columns: &a3
        - exercise_id
        - muscle_id
        - role
      filter: *a1
      limit: 1000
  - role: admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
  - role: super_admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
update_permissions:
  - role: admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
  - role: super_admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
delete_permissions:
  - role: admin
    permission:
      filter: *a1
  - role: super_admin
    permission:
      filter: *a1
