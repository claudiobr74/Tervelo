table:
  name: exercise_variants
  schema: public
object_relationships:
  - name: canonical_exercise
    using:
      foreign_key_constraint_on: canonical_exercise_id
insert_permissions:
  - role: admin
    permission:
      check: &a1 {}
      columns: &a2
        - canonical_exercise_id
        - name_pt
  - role: super_admin
    permission:
      check: *a1
      columns: *a2
select_permissions:
  - role: user
    permission:
      columns: &a3
        - id
        - canonical_exercise_id
        - name_pt
        - created_at
      filter: *a1
      limit: 1000
  - role: admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
  - role: super_admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
update_permissions:
  - role: admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
  - role: super_admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
delete_permissions:
  - role: admin
    permission:
      filter: *a1
  - role: super_admin
    permission:
      filter: *a1
