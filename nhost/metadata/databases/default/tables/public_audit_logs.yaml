table:
  name: audit_logs
  schema: public
insert_permissions:
  - role: super_admin
    permission:
      check: &a1 {}
      set:
        actor_user_id: x-hasura-user-id
      columns:
        - action
        - entity_type
        - entity_id
        - payload
select_permissions:
  - role: super_admin
    permission:
      columns:
        - id
        - actor_user_id
        - action
        - entity_type
        - entity_id
        - payload
        - created_at
      filter: *a1
      limit: 200
