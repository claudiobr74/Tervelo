table:
  name: weekly_review_decisions
  schema: public
object_relationships:
  - name: weekly_review
    using:
      foreign_key_constraint_on: weekly_review_id
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - weekly_review_id
        - decision_kind
        - suggested_changes_json
        - accepted_changes_json
        - rejected_changes_json
        - follow_up_period_start
        - follow_up_period_end
        - follow_up_performance_json
        - follow_up_recovery_json
        - follow_up_adherence_json
        - follow_up_nutrition_json
        - follow_up_body_json
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - weekly_review_id
        - decision_kind
        - suggested_changes_json
        - accepted_changes_json
        - rejected_changes_json
        - follow_up_period_start
        - follow_up_period_end
        - follow_up_performance_json
        - follow_up_recovery_json
        - follow_up_adherence_json
        - follow_up_nutrition_json
        - follow_up_body_json
        - created_at
        - updated_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a1
      check: *a1
      columns:
        - accepted_changes_json
        - rejected_changes_json
        - follow_up_period_start
        - follow_up_period_end
        - follow_up_performance_json
        - follow_up_recovery_json
        - follow_up_adherence_json
        - follow_up_nutrition_json
        - follow_up_body_json
