table:
  name: body_measurements
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - measured_at
        - source
        - weight_kg
        - body_fat_percent
        - waist_cm
        - abdomen_cm
        - hip_cm
        - chest_cm
        - left_arm_cm
        - right_arm_cm
        - left_forearm_cm
        - right_forearm_cm
        - left_thigh_cm
        - right_thigh_cm
        - left_calf_cm
        - right_calf_cm
        - extra_json
        - notes
        - supersedes_id
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - measured_at
        - source
        - weight_kg
        - body_fat_percent
        - waist_cm
        - abdomen_cm
        - hip_cm
        - chest_cm
        - left_arm_cm
        - right_arm_cm
        - left_forearm_cm
        - right_forearm_cm
        - left_thigh_cm
        - right_thigh_cm
        - left_calf_cm
        - right_calf_cm
        - extra_json
        - notes
        - supersedes_id
        - created_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
