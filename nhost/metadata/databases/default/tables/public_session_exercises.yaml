table:
  name: session_exercises
  schema: public
object_relationships:
  - name: session
    using:
      foreign_key_constraint_on: session_id
insert_permissions:
  - role: user
    permission:
      check: &a1
        session:
          user_id:
            _eq: X-Hasura-User-Id
      columns:
        - session_id
        - position
        - exercise_variant_id
        - planned_equipment_id
        - rest_seconds
        - method_kind
        - method_params
        - group_id
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - session_id
        - position
        - exercise_variant_id
        - planned_equipment_id
        - rest_seconds
        - method_kind
        - method_params
        - group_id
        - notes
        - created_at
      filter: *a1
      limit: 200
  - role: admin
    permission:
      columns:
        - id
        - session_id
        - position
        - exercise_variant_id
        - planned_equipment_id
        - rest_seconds
        - method_kind
        - method_params
        - group_id
        - notes
        - created_at
      filter: &a2 {}
      limit: 200
  - role: super_admin
    permission:
      columns:
        - id
        - session_id
        - position
        - exercise_variant_id
        - planned_equipment_id
        - rest_seconds
        - method_kind
        - method_params
        - group_id
        - notes
        - created_at
      filter: *a2
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a1
      check: *a1
      columns:
        - position
        - exercise_variant_id
        - planned_equipment_id
        - rest_seconds
        - method_kind
        - method_params
        - group_id
        - notes
