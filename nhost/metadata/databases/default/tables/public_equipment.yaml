table:
  name: equipment
  schema: public
insert_permissions:
  - role: admin
    permission:
      check: &a1 {}
      columns: &a2
        - category_id
        - name_pt
        - movement_pattern_id
        - resistance_system
        - starting_load_kg
        - independent_arms
        - increment_kg
  - role: super_admin
    permission:
      check: *a1
      columns: *a2
select_permissions:
  - role: user
    permission:
      columns: &a3
        - id
        - category_id
        - name_pt
        - movement_pattern_id
        - resistance_system
        - starting_load_kg
        - independent_arms
        - increment_kg
        - created_at
        - updated_at
      filter: *a1
      limit: 1000
  - role: admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
  - role: super_admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
update_permissions:
  - role: admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
  - role: super_admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
delete_permissions:
  - role: admin
    permission:
      filter: *a1
  - role: super_admin
    permission:
      filter: *a1
