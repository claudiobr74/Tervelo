table:
  name: training_sessions
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - week_id
        - gym_id
        - scheduled_at
        - started_at
        - completed_at
        - status
        - client_mutation_id
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - week_id
        - user_id
        - gym_id
        - scheduled_at
        - started_at
        - completed_at
        - status
        - client_mutation_id
        - created_at
        - updated_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a1
      check: *a1
      columns:
        - week_id
        - gym_id
        - scheduled_at
        - started_at
        - completed_at
        - status
