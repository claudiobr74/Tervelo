table:
  name: athlete_state_snapshots
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - period_start
        - period_end
        - algorithm_version
        - overall_state
        - training_state
        - training_confidence
        - recovery_state
        - recovery_confidence
        - nutrition_state
        - nutrition_confidence
        - body_composition_state
        - body_composition_confidence
        - heart_rate_state
        - heart_rate_enabled
        - heart_rate_confidence
        - adherence_state
        - limitations_json
        - alerts_json
        - missing_data_json
        - reasons_json
        - data_quality
        - payload_json
        - generated_at
        - client_mutation_id
select_permissions:
  - role: user
    permission:
      columns: &a2
        - id
        - user_id
        - period_start
        - period_end
        - algorithm_version
        - overall_state
        - training_state
        - training_confidence
        - recovery_state
        - recovery_confidence
        - nutrition_state
        - nutrition_confidence
        - body_composition_state
        - body_composition_confidence
        - heart_rate_state
        - heart_rate_enabled
        - heart_rate_confidence
        - adherence_state
        - limitations_json
        - alerts_json
        - missing_data_json
        - reasons_json
        - data_quality
        - payload_json
        - generated_at
        - client_mutation_id
        - created_at
      filter: *a1
      limit: 100
  - role: admin
    permission:
      columns: *a2
      filter: &a3 {}
      limit: 200
  - role: super_admin
    permission:
      columns: *a2
      filter: *a3
      limit: 500
