table:
  name: gym_memberships
  schema: public
object_relationships:
  - name: gym
    using:
      foreign_key_constraint_on: gym_id
insert_permissions:
  - role: user
    permission:
      check: &a1
        user_id: &a2
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - gym_id
        - is_primary
        - status
  - role: admin
    permission:
      check: &a3 {}
      columns:
        - gym_id
        - user_id
        - is_primary
        - status
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - gym_id
        - user_id
        - is_primary
        - status
        - created_at
      filter:
        _or:
          - *a1
          - &a4
            gym:
              owner_user_id: *a2
      limit: 50
  - role: admin
    permission:
      columns:
        - id
        - gym_id
        - user_id
        - is_primary
        - status
        - created_at
      filter: *a3
      limit: 200
  - role: super_admin
    permission:
      columns:
        - id
        - gym_id
        - user_id
        - is_primary
        - status
        - created_at
      filter: *a3
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: &a5
        _or:
          - *a1
          - *a4
      check: *a5
      columns:
        - is_primary
        - status
  - role: admin
    permission:
      filter: *a3
      check: *a3
      columns:
        - is_primary
        - status
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - *a1
          - *a4
  - role: admin
    permission:
      filter: *a3
