table:
  name: equipment_models
  schema: public
insert_permissions:
  - role: admin
    permission:
      check: &a1 {}
      columns: &a2
        - equipment_id
        - manufacturer_id
        - model_name
  - role: super_admin
    permission:
      check: *a1
      columns: *a2
select_permissions:
  - role: user
    permission:
      columns: &a3
        - id
        - equipment_id
        - manufacturer_id
        - model_name
        - created_at
      filter: *a1
      limit: 1000
  - role: admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
  - role: super_admin
    permission:
      columns: *a3
      filter: *a1
      limit: 1000
update_permissions:
  - role: admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
  - role: super_admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
delete_permissions:
  - role: admin
    permission:
      filter: *a1
  - role: super_admin
    permission:
      filter: *a1
