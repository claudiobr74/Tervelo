table:
  name: gyms
  schema: public
array_relationships:
  - name: memberships
    using:
      foreign_key_constraint_on:
        column: gym_id
        table:
          name: gym_memberships
          schema: public
  - name: bars
    using:
      foreign_key_constraint_on:
        column: gym_id
        table:
          name: gym_bars
          schema: public
  - name: plates
    using:
      foreign_key_constraint_on:
        column: gym_id
        table:
          name: gym_plates
          schema: public
insert_permissions:
  - role: user
    permission:
      check: &a3
        owner_user_id:
          _eq: X-Hasura-User-Id
      set: &a1
        owner_user_id: x-hasura-user-id
      columns:
        - name
        - notes
  - role: admin
    permission:
      check: &a2 {}
      set: *a1
      columns:
        - name
        - notes
  - role: super_admin
    permission:
      check: *a2
      set: *a1
      columns:
        - name
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - owner_user_id
        - organization_id
        - name
        - notes
        - created_at
        - updated_at
      filter: *a3
      limit: 50
  - role: admin
    permission:
      columns:
        - id
        - owner_user_id
        - organization_id
        - name
        - notes
        - created_at
        - updated_at
      filter: *a2
      limit: 200
  - role: super_admin
    permission:
      columns:
        - id
        - owner_user_id
        - organization_id
        - name
        - notes
        - created_at
        - updated_at
      filter: *a2
      limit: 500
update_permissions:
  - role: user
    permission:
      filter: *a3
      check: *a3
      columns:
        - name
        - notes
  - role: admin
    permission:
      filter: *a2
      check: *a2
      columns:
        - name
        - notes
  - role: super_admin
    permission:
      filter: *a2
      check: *a2
      columns:
        - name
        - notes
delete_permissions:
  - role: user
    permission:
      filter: *a3
  - role: admin
    permission:
      filter: *a2
  - role: super_admin
    permission:
      filter: *a2
