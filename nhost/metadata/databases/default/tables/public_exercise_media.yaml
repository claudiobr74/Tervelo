table:
  name: exercise_media
  schema: public
object_relationships:
  - name: canonical_exercise
    using:
      foreign_key_constraint_on: canonical_exercise_id
insert_permissions:
  - role: admin
    permission:
      check: &a1 {}
      columns: &a2
        - canonical_exercise_id
        - kind
        - file_id
        - object_key
        - mime_type
        - bytes
        - sha256
  - role: super_admin
    permission:
      check: *a1
      columns: *a2
select_permissions:
  - role: user
    permission:
      columns: &a3
        - id
        - canonical_exercise_id
        - kind
        - file_id
        - object_key
        - mime_type
        - bytes
        - sha256
        - created_at
      filter: *a1
      limit: 2500
  - role: admin
    permission:
      columns: *a3
      filter: *a1
      limit: 2500
  - role: super_admin
    permission:
      columns: *a3
      filter: *a1
      limit: 2500
update_permissions:
  - role: admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
  - role: super_admin
    permission:
      filter: *a1
      check: *a1
      columns: *a2
delete_permissions:
  - role: admin
    permission:
      filter: *a1
  - role: super_admin
    permission:
      filter: *a1
