mutation UpsertHeartRatePreference($preference_value: String!) {
  insert_athlete_preferences_one(
    object: { preference_key: "heart_rate_enabled", preference_value: $preference_value }
    on_conflict: {
      constraint: athlete_preferences_user_id_preference_key_key
      update_columns: [preference_value]
    }
  ) {
    id
    preference_key
    preference_value
  }
}
